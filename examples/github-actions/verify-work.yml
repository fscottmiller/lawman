# Verify a work contract from the tests of this execution.
#
# Copy this into `.github/workflows/` of the repository being governed. The
# whole point is the order of the steps: the tests run here, in this job, over
# the revision this job checked out, and Lawman reads what they wrote. There is
# no artifact to download and no workflow run to go looking for (ADR 12).
#
# `GITHUB_ACTIONS`, `GITHUB_SHA`, `GITHUB_REPOSITORY`, `GITHUB_RUN_ID`, and
# `GITHUB_RUN_ATTEMPT` are set by Actions. Lawman reads them itself; nothing
# below passes a revision, and no flag would accept one.

name: Verify work

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Any runner that writes a JUnit XML report will do. JUnit is the
      # interchange format, not a Lawman concept and not a Python one.
      # `--junitxml` here; `--reporter junit`, `-Dsurefire`, `go-junit-report`,
      # and `--format JUnit` all produce the same document elsewhere.
      - name: Run the tests
        run: pytest --junitxml=junit.xml
        continue-on-error: true

      # The contract comes from the issue that ordered the work; the proof
      # comes from the report above. Exit 0 means every criterion was proven
      # by the test the contract named. Exit 1 means one was not. Exit 2 means
      # Lawman refused to judge — a malformed execution, an unreadable report,
      # or two tests answering to one bound name.
      - name: Verify the work contract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: https://github.com/fscottmiller/lawman/issues/14
        run: python -m lawman work --issue "$ISSUE_URL" --junit junit.xml
