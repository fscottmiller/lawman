# Tool configuration, not packaging. Lawman is still not installable, and still
# has no runtime dependencies (ADR 2, ADR 7).
#
# The settings describe the style this repository already had. Uncommitted
# tool defaults are worse than no tools at all: they hand every contributor a
# different answer, and the diff churn looks like a decision nobody made.

# Strict, and only over the shipped code. Tests hand invalid values to the
# types on purpose — Contract(requires=None), a write to a read-only mapping —
# because that is what proves the types reject them. Type-checking those means
# fifteen `# type: ignore` comments on the suite's most valuable tests, which
# is an invitation to "fix" the test by deleting the invalid case. The test
# suite already runs them. flake8 and isort still cover tests/.
[mypy]
python_version = 3.11
files = lawman
strict = True

[flake8]
max-line-length = 120
extend-ignore = E203
exclude = .git,__pycache__

[isort]
line_length = 120
profile = black
