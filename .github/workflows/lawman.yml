name: Lawman

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read

jobs:
  lawman:
    name: Lawman
    runs-on: ubuntu-latest
    env:
      OPA_VERSION: "1.19.0"
      OPA_SHA256: "1dd5c5591ff856f5e20a1d66bafae9511ddf3c5552ed3b5070c70b2b6580ee3f"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OPA
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  ${RUNNER_TEMP}/opa" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/opa"
          sudo mv "${RUNNER_TEMP}/opa" /usr/local/bin/opa
      - name: Install the JUnit adapter
        run: pip install -r requirements-dev.txt
      - name: Run Lawman
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m lawman.pr_gate
