name: CI

on: pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # One exact version, checksummed. Lawman delegates every transition
      # decision to this executable, so "whatever is latest" would make the
      # decision unrepeatable (ADR 9).
      OPA_VERSION: "1.19.0"
      OPA_SHA256: "1dd5c5591ff856f5e20a1d66bafae9511ddf3c5552ed3b5070c70b2b6580ee3f"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OPA
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  ${RUNNER_TEMP}/opa" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/opa"
          sudo mv "${RUNNER_TEMP}/opa" /usr/local/bin/opa
          opa version
      - run: python -m unittest discover -s tests

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m mypy
      - run: python -m flake8
      - run: python -m isort --check-only lawman tests
